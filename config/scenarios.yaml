# Sensitivity scenarios.
#
# Each scenario pins one or more ASSUMPTION-tagged parameters to a specific point *within the range
# already declared in sim_params.yaml*. Nothing here invents a new range -- the sweep tests across
# uncertainty we already committed to, which is the difference between sensitivity analysis and
# moving the goalposts.
#
# Deliberately a small set of targeted probes rather than a full factorial grid: each scenario exists
# to attack a specific assumption, and can be named and defended individually.
#
# `overrides` uses dotted paths into sim_params.yaml. Ranges collapsed to a single point are written
# as [x, x] so the sampler returns exactly x.

scenarios:
  - name: frozen_defaults
    probes: "reference case -- the committed ranges, sampled as declared"
    overrides: {}

  # ---- A1: the highest-risk assumption, and it sits on the baseline side ----
  - name: baseline_documented_cadence
    probes: "A1 -- baseline retries next day (the documented reading, and the weakest baseline)"
    overrides:
      retry_policy_shared.card_retry_cadence_days.value: [1]

  - name: baseline_t1_t2_t3
    probes: "A1 -- the widely-repeated but unverifiable T+1/T+2/T+3 schedule"
    overrides:
      retry_policy_shared.card_retry_cadence_days.value: [1, 2, 3]

  - name: baseline_escalating_backoff
    probes: "A1 -- escalating backoff"
    overrides:
      retry_policy_shared.card_retry_cadence_days.value: [1, 3, 7]

  - name: baseline_strongest_spread
    probes: "A1 -- spread backoff, empirically the STRONGEST baseline. The conservative headline case."
    overrides:
      retry_policy_shared.card_retry_cadence_days.value: [3, 7, 14]

  - name: baseline_weekly
    probes: "A1 -- weekly retries"
    overrides:
      retry_policy_shared.card_retry_cadence_days.value: [7, 7, 7]

  # ---- A35: the most attackable parameter, drives the money headline ----
  - name: escalation_pessimistic
    probes: "A35 -- only 10% of customers act on an escalation"
    overrides:
      escalation.response_rate.range: [0.10, 0.10]

  - name: escalation_optimistic
    probes: "A35 -- 40% of customers act on an escalation"
    overrides:
      escalation.response_rate.range: [0.40, 0.40]

  # ---- A13: directly attacks the adaptive policy's population-level salary bet ----
  # OUT-OF-RANGE, DELIBERATELY. The declared weight range for irregular income is [0.2, 0.4]; this
  # scenario pushes it to 0.70, which is outside the uncertainty we committed to. Flagged 2026-08-26
  # after the adversarial red team caught the inconsistency: we required the model to stay inside
  # declared ranges while one of our own scenarios did not.
  #
  # It is kept because it errs against us -- a mostly-irregular population is hostile to the salary
  # bet, so this is a harder test than the declared range allows, not an easier one. But it is an
  # extreme stress test, not a sensitivity scenario, and the in-range version now exists below.
  - name: mostly_irregular_income_out_of_range
    probes: "A13 (EXTREME, outside declared range) -- most customers have no salary cycle at all"
    overrides:
      income_event_population_mixture.types:
        - {name: clustered_month_end_or_1st, weight_range: [0.15, 0.15]}
        - {name: clustered_near_7th, weight_range: [0.15, 0.15]}
        - {name: irregular_no_clear_cycle, weight_range: [0.70, 0.70]}

  - name: mostly_irregular_income_in_range
    probes: "A13 -- irregular income at the top of its DECLARED range [0.2, 0.4], combined with the strongest baseline. The honest in-range version of the attack above; surfaced by the red team."
    overrides:
      retry_policy_shared.card_retry_cadence_days.value: [3, 7, 14]
      income_event_population_mixture.types:
        - {name: clustered_month_end_or_1st, weight_range: [0.3, 0.3]}
        - {name: clustered_near_7th, weight_range: [0.3, 0.3]}
        - {name: irregular_no_clear_cycle, weight_range: [0.4, 0.4]}

  - name: mostly_salaried
    probes: "A13 -- most customers follow a salary cycle, favouring the bet"
    overrides:
      income_event_population_mixture.types:
        - {name: clustered_month_end_or_1st, weight_range: [0.45, 0.45]}
        - {name: clustered_near_7th, weight_range: [0.45, 0.45]}
        - {name: irregular_no_clear_cycle, weight_range: [0.10, 0.10]}

  # ---- A8 / A15 / A16 ----
  - name: severe_congestion
    probes: "A8 -- congestion window degrades success by 50%"
    overrides:
      failure_classes.npci_congestion.success_probability_degradation.range: [0.50, 0.50]

  - name: mild_congestion
    probes: "A8 -- congestion window barely matters"
    overrides:
      failure_classes.npci_congestion.success_probability_degradation.range: [0.10, 0.10]

  - name: volatile_balances
    probes: "A15 -- fast decay and high spending volatility"
    overrides:
      balance_evolution.decay_rate_range: [0.08, 0.08]
      balance_evolution.volatility_range: [0.20, 0.20]

  - name: stable_balances
    probes: "A15 -- slow decay, low volatility"
    overrides:
      balance_evolution.decay_rate_range: [0.02, 0.02]
      balance_evolution.volatility_range: [0.05, 0.05]

  - name: early_revocation
    probes: "A16 -- customers revoke after only 2 consecutive failures, punishing slow policies"
    overrides:
      failure_classes.mandate_revoked.revocation_trigger_consecutive_failures.range: [2, 2]

  # ---- A36: the failure-class mix. Sweepable only since it was moved into the frozen config;
  # it was previously hardcoded in the harness and therefore untestable. Highest-impact single
  # parameter in the simulator.
  - name: funds_dominated_mix
    probes: "A36 -- almost everything is an insufficient-funds failure, maximising the salary bet's leverage"
    overrides:
      failure_class_mix.weights:
        insufficient_funds: 0.80
        npci_congestion: 0.05
        notification_undelivered: 0.05
        bank_technical_decline: 0.05
        mandate_expired: 0.025
        mandate_revoked: 0.025

  - name: technical_dominated_mix
    probes: "A36 -- mostly transient technical declines, where timing intelligence should matter least"
    overrides:
      failure_class_mix.weights:
        insufficient_funds: 0.20
        npci_congestion: 0.20
        notification_undelivered: 0.15
        bank_technical_decline: 0.35
        mandate_expired: 0.05
        mandate_revoked: 0.05

  - name: high_unrecoverable_mix
    probes: "A36 -- a third of failures are expired or revoked mandates that no policy can recover"
    overrides:
      failure_class_mix.weights:
        insufficient_funds: 0.35
        npci_congestion: 0.12
        notification_undelivered: 0.10
        bank_technical_decline: 0.10
        mandate_expired: 0.16
        mandate_revoked: 0.17

# sim_params.yaml — FROZEN as of the commit hash recorded in meta.frozen_commit_hash below.
#
# Per the anti-circularity requirement in eval/ methodology: this file was reviewed and committed
# BEFORE any policy code was written or evaluated against it. Any change from here forward requires
# a dated entry in assumptions.md's CHANGELOG, with an explicit statement of whether adaptive-policy
# results were already observed before the change.
#
# Every field below carries an `assumption_id` pointing to assumptions.md, and a `status` of FACT or
# ASSUMPTION. Fields marked ASSUMPTION carry a `range` (swept in sensitivity analysis) rather than a single
# point value wherever the methodology requires it — point values here are draft placeholders only.

meta:
  frozen: true
  frozen_at: "2026-08-25T00:00:00Z"
  frozen_commit_hash: "8e2d9a49d5e3cbea10f461e67059dc9e79f94638"

retry_policy_shared:
  max_attempts:
    value: 4
    status: FACT
    assumption_id: A20
    source: "Razorpay docs — subscription moves to `halted` after 4 failed attempts"

  card_retry_cadence_days:
    # Only "We automatically retry the payment on the following day" is documented (cards). The
    # multi-attempt spacing is unpublished for both cards and UPI -- this is A1, the project's
    # highest-risk assumption, and it sits on the BASELINE side of every lift number.
    #
    # Corrected 2026-08-25: `[1]` was originally chosen as the "most retry-friendly" reading of the
    # brief. Measurement showed the opposite -- in an insufficient-funds-dominated world, retrying
    # next-day repeatedly hammers an empty account, while spreading attempts catches income events.
    # `[1]` is the WEAKEST plausible baseline (63.5%), not the strongest (74.6% at [3,7,14]), so it
    # was quietly inflating adaptive's lift. See docs/build_log.md entry 13.
    #
    # `value` stays at the documented reading. `plausible_alternatives` is swept, and the headline
    # lift is reported against the STRONGEST baseline, not this one.
    value: [1]
    plausible_alternatives:
      - [1]           # documented reading: retry the following day, every time
      - [1, 2, 3]     # T+1/T+2/T+3, the widely-repeated (but unverifiable) schedule
      - [1, 3, 7]     # escalating backoff
      - [3, 7, 14]    # spread backoff -- empirically the strongest baseline
      - [7, 7, 7]     # weekly
    status: ASSUMPTION
    assumption_id: A1

  emandate_bank_holiday_shift:
    rule: "T-1, or T-3 if both T and T-1 are bank holidays"
    status: FACT
    assumption_id: A3
    source: "Razorpay Payment Retries docs (Emandate section)"

failure_class_mix:
  # Moved here from eval/harness.py on 2026-08-25 (A36). This is ground truth -- how often each
  # failure type occurs -- and it was hardcoded outside the frozen config, which meant the single
  # most impactful parameter in the project sat outside the freeze protocol and could not be swept.
  # See docs/build_log.md entry 18.
  #
  # No public source exists for the failure-class distribution of Indian recurring payments; that is
  # exactly the proprietary data this project is built to work without. Insufficient funds dominates,
  # consistent with the one aggregate signal we do have (A9: ~20M monthly UPI Autopay revocations
  # attributed to low balance).
  status: ASSUMPTION
  assumption_id: A36
  weights:
    insufficient_funds: 0.55
    npci_congestion: 0.15
    notification_undelivered: 0.10
    bank_technical_decline: 0.10
    mandate_expired: 0.05
    mandate_revoked: 0.05

failure_classes:
  insufficient_funds:
    per_attempt_failure_probability:
      status: ASSUMPTION
      assumption_id: A10
      note: "Derived from balance_evolution process below, not a looked-up number"

  notification_undelivered:
    # Corrected 2026-08-25 after primary-source check (see assumptions.md CHANGELOG).
    # Clause 6(a) obligates the issuer to SEND a pre-transaction notification at least 24h before
    # the debit. It does NOT require delivery confirmation, and contains NO clause blocking a debit
    # when the notification fails to reach the customer. The hard constraint is therefore on
    # NOTIFICATION-TO-DEBIT TIMING, not on delivery status.
    min_hours_between_notification_and_debit:
      value: 24
      status: FACT
      assumption_id: A5
      source: "RBI Digital Payments E-mandate Framework 2026, Clause 6(a): 'An issuer shall send a
               pre-transaction notification to the customer, at least 24 hours prior to the actual
               charge / debit.'"
    delivery_failure_rate:
      range: [0.02, 0.10]   # placeholder range, generic messaging-industry benchmark, not India/Razorpay-specific
      status: ASSUMPTION
      assumption_id: A17
    undelivered_success_multiplier:
      range: [0.3, 0.8]     # BEHAVIOURAL, not regulatory: an unaware customer is less likely to
      status: ASSUMPTION    # top up before the debit. No regulatory block applies.
      assumption_id: A34

  npci_congestion:
    bad_window_local_time: ["10:00", "13:00"]
    status: FACT
    assumption_id: A7
    source: "NPCI 2026 Traffic Management framework (Republic World, May 2026) — reverify before submission"
    success_probability_degradation:
      range: [0.10, 0.50]  # placeholder — no public magnitude exists
      status: ASSUMPTION
      assumption_id: A8

  bank_technical_decline:
    base_rate:
      range: [0.01, 0.05]  # placeholder, added 2026-08-25 (A31) — no adaptive-policy results existed yet
      status: ASSUMPTION
      assumption_id: A31
      note: "No public source found at all for this failure class — least-evidenced in the taxonomy"

  mandate_expired:
    recoverable_by_retry_timing: false
    status: FACT
    assumption_id: A19
    validity_days_range: [180, 1095]  # placeholder, added 2026-08-25 (A32)
    validity_days_status: ASSUMPTION

  mandate_revoked:
    recoverable_by_retry_timing: false
    status: FACT
    assumption_id: A19
    revocation_trigger_consecutive_failures:
      range: [2, 4]        # placeholder — no public source for this threshold
      status: ASSUMPTION
      assumption_id: A16

balance_evolution:
  status: ASSUMPTION
  assumption_id: [A14, A15]
  note: "Largest single assumption cluster in the simulator. Shape (rise at income event, decay between
         events) is an inference from general financial-behavior patterns, not a cited curve. Decay rate
         and volatility are placeholders, swept in sensitivity analysis, never fixed to one guessed value."
  decay_rate_range: [0.02, 0.08]     # placeholder, per-day fraction of balance spent
  volatility_range: [0.05, 0.20]     # placeholder, coefficient of variation

income_event_population_mixture:
  status: ASSUMPTION
  assumption_id: [A12, A13]
  note: "Population-level clustering is MEDIUM-HIGH confidence; individual adherence is LOW. Modeled as a
         mixture of customer types, not one universal date."
  types:
    - name: clustered_month_end_or_1st
      weight_range: [0.3, 0.5]
    - name: clustered_near_7th
      weight_range: [0.2, 0.4]
    - name: irregular_no_clear_cycle
      weight_range: [0.2, 0.4]

mandate_amount_distribution:
  status: ASSUMPTION
  assumption_id: A22
  note: "No public per-mandate amount distribution sourced for OTT/SIP/EMI mix. Placeholder bands only —
         needed for the ₹-recovered metric, the direct evidence for the rubric's 'measured money' clause."
  bands_inr:
    ott_subscription: [99, 999]
    sip_investment: [500, 25000]
    emi: [1000, 50000]
  type_mixture_weights:  # placeholder, added 2026-08-25 (A33) — no adaptive-policy results existed yet
    status: ASSUMPTION
    assumption_id: A33
    ott_subscription: [0.4, 0.6]
    sip_investment: [0.2, 0.4]
    emi: [0.1, 0.3]

compliance_floors:
  otp_free_ceiling_inr:
    value: 15000
    higher_ceiling_inr: 100000
    higher_ceiling_categories: ["insurance", "mutual_funds", "credit_card_bills"]
    status: FACT
    assumption_id: A6
    source: "RBI E-Mandate Framework 2026 — reverify immediately before submission, this figure has a revision history"

escalation:
  # Added 2026-08-25 (A35). When a policy stops and escalates (asks the customer to re-authenticate,
  # re-mandate, or pay manually), some fraction of customers act on it. No public source exists for
  # this rate, so it is swept.
  #
  # Anti-inflation note: this rate is applied IDENTICALLY to every policy that escalates, so it
  # cannot manufacture lift on its own. The only asymmetry it creates is that a policy which fires a
  # legally-refusable auto-retry instead of escalating gets nothing -- which is the real cost of
  # compliance-blindness, not an artefact of this parameter.
  response_rate:
    range: [0.10, 0.40]
    status: ASSUMPTION
    assumption_id: A35
  response_lag_days:
    range: [1, 7]
    status: ASSUMPTION
    assumption_id: A35

metrics:
  wasted_attempt_epsilon:
    value: 0.01
    status: ASSUMPTION
    assumption_id: A23
    note: "Frozen here before any evaluation run. Never redefined after seeing results."
